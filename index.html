<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 课程助教 - 多轮对话与 Markdown 渲染版</title>
    <!-- 样式文件 -->
    <link rel="stylesheet" href="static/style.css">
    <!-- 引入开源 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <h2>🎓 高校课程 AI 助教 (多轮记忆 & Markdown)</h2>

    <div class="box">
        <h3>1. 上传课程讲义 (PDF)</h3>
        <input type="file" id="pdfFile" accept=".pdf">
        <button id="uploadBtn">上传解析</button>
        <p id="uploadStatus" style="margin-bottom:0; color:#4b5563;"></p>
    </div>

    <div class="box">
        <h3>2. 在线对话问答</h3>
        <div id="chatHistory" class="chat-history"></div>
        <textarea id="question" placeholder="例如：新加坡第三天的行程是什么？（之后可继续追问：请详细说说第一项）"></textarea><br><br>
        <button id="sendBtn">发送提问</button>
    </div>

    <!-- 前端逻辑脚本（放在 body 末尾，保证 DOM 已加载） -->
    <script src="static/script.js"></script>
</body>
</html>
