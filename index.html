<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 课程助教 - 打字机版</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 750px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .box { border: 1px solid #e5e7eb; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
        textarea { width: 100%; height: 80px; margin-top: 10px; box-sizing: border-box; padding: 10px; }
        button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .answer { background: #ffffff; border: 1px solid #e5e7eb; padding: 15px; border-radius: 6px; white-space: pre-wrap; min-height: 100px; }
    </style>
</head>
<body>
    <h2>🎓 高校课程 AI 助教 (流式打字机)</h2>
    
    <div class="box">
        <h3>1. 上传课程讲义 (PDF)</h3>
        <input type="file" id="pdfFile" accept=".pdf">
        <button onclick="uploadPDF()">上传解析</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="box">
        <h3>2. 课程内容提问</h3>
        <textarea id="question" placeholder="例如：新加坡第三天的行程规划是什么？"></textarea><br><br>
        <button onclick="askAI()">发送提问</button>
        <h4>AI 助教回答：</h4>
        <div id="answerBox" class="answer">等待提问...</div>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            if(!fileInput.files[0]) return alert("请先选择文件");
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            document.getElementById('uploadStatus').innerText = "解析中，请稍候...";
            
            const res = await fetch('http://127.0.0.1:8000/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('uploadStatus').innerText = data.message || data.detail;
        }

        async function askAI() {
            const q = document.getElementById('question').value;
            if(!q) return;
            
            const answerBox = document.getElementById('answerBox');
            answerBox.innerText = ""; // 清空之前的文字

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });

                if (!response.ok) {
                    answerBox.innerText = "请求失败，请检查后端服务。";
                    return;
                }

                // 重点：使用 ReadableStream 读取流数据
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    // 将收到的字节流解码为文字，并追加写入网页
                    const textChunk = decoder.decode(value, { stream: true });
                    answerBox.innerText += textChunk;
                }

            } catch (err) {
                answerBox.innerText = "网络连接错误: " + err.message;
            }
        }
    </script>
</body>
</html>
