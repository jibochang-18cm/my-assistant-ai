<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 课程助教</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; margin-top: 10px; }
        button { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .answer { background: #f4f4f5; padding: 15px; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>🎓 高校课程 AI 助教 MVP</h2>
    
    <div class="box">
        <h3>1. 上传课程讲义 (PDF)</h3>
        <input type="file" id="pdfFile" accept=".pdf">
        <button onclick="uploadPDF()">上传解析</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="box">
        <h3>2. 课程内容提问</h3>
        <textarea id="question" placeholder="例如：第三章提到的死锁四大必要条件是什么？"></textarea><br>
        <button onclick="askAI()">发送提问</button>
        <h4>回答结果：</h4>
        <div id="answerBox" class="answer">等待提问...</div>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            if(!fileInput.files[0]) return alert("请先选择文件");
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            document.getElementById('uploadStatus').innerText = "解析中，请稍候...";
            
            const res = await fetch('http://127.0.0.1:8000/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('uploadStatus').innerText = data.message || data.detail;
        }

        async function askAI() {
            const q = document.getElementById('question').value;
            if(!q) return;
            
            document.getElementById('answerBox').innerText = "AI 正在查阅讲义思考中...";
            
            const res = await fetch('http://127.0.0.1:8000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            });
            const data = await res.json();
            
            if(res.ok) {
                document.getElementById('answerBox').innerText = `${data.answer}\n\n【参考出处】：${data.sources.join(', ')}`;
            } else {
                document.getElementById('answerBox').innerText = "发生错误：" + data.detail;
            }
        }
    </script>
</body>
</html>
